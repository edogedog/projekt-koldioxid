{% extends "base.html" %}

{% block content %}

<h1>Veckorapport</h1>

<form method="get" action="/ui/reports/weekly">

    <label for="user_id">Användare:</label>
    <select name="user_id" id="user_id" required>
        {% for user in users %}
        <option value="{{ user.id }}">
            {{ user.name }}
        </option>
        {% endfor %}
    </select>

    <label for="week_start">Veckostart (måndag):</label>
    <input type="date" name="week_start" id="week_start" required>

    <button type="submit">Visa rapport</button>

</form>

{% if err %}
<p class="error">{{ err }}</p>
{% endif %}

{% if total is not none %}
<div class="report-box">
    <h2>Resultat</h2>
    <p>Total CO₂e för veckan: <strong>{{ total }}</strong> kg</p>
</div>
{% endif %}

{% endblock %}
