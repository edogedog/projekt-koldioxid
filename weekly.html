{% extends "base.html" %}

{% block content %}
<section class="page-section">
    <h2>Veckorapport</h2>

    {% if error %}
        <p class="message-error">{{ error }}</p>
    {% endif %}

    {% if total is not none %}
        <p class="message-success">Total CO₂e för veckan: {{ total }}</p>
    {% endif %}

    <div class="card">
        <h3>Visa rapport</h3>

        <form method="get" action="/ui/reports/weekly" class="weekly-form">
            <label for="user_id">Användare</label>
            <select id="user_id" name="user_id">
                {% for u in users %}
                    <option value="{{ u.id }}">{{ u.name }}</option>
                {% endfor %}
            </select>

            <label for="week_start">Veckostart måndag</label>

            <div class="form-row">
                <input type="date" id="week_start" name="week_start">
                <button type="submit" class="btn">Visa rapport</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
