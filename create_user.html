{% extends "base.html" %}

{% block content %}

<section class="page-section">
    <h2>Användare</h2>

    {% if message %}
        <div class="message-success">{{ message }}</div>
    {% endif %}

    {% if error %}
        <div class="message-error">{{ error }}</div>
    {% endif %}

    <div class="card">
        <h3>Skapa användare</h3>

        <form method="post" action="/ui/users">
            <label for="name">Namn</label>
            <input type="text" id="name" name="name">

            <button type="submit" class="btn">Skapa</button>
        </form>
    </div>

    <div class="card">
        <h3>Befintliga användare</h3>

        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Namn</th>
                    <th>Åtgärd</th>
                </tr>
            </thead>

            <tbody>
                {% for u in users %}
                <tr>
                    <td>{{ u.id }}</td>
                    <td>{{ u.name }}</td>
                    <td>
                        <form method="post" action="/ui/users/{{ u.id }}/delete">
                            <button 
                                type="submit" 
                                class="btn btn-danger"
                                onclick="return confirm('Ta bort användaren {{ u.name }}?');">
                                Ta bort
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</section>

{% endblock %}
