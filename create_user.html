<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Användare</title>
</head>
<body>

    <h1>Användare</h1>

    {% if message %}
    <p style="color: green;">{{ message }}</p>
    {% endif %}

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}

    <!-- skapa users -->
    <h2>Skapa användare</h2>

    <form method="post" action="/ui/users">
        <input type="text" name="name" placeholder="Namn">
        <button type="submit">Skapa</button>
    </form>

    <hr>

    <!-- lista users -->
    <h2>Befintliga användare</h2>

    <table border="1" cellpadding="6" cellspacing="0">
        <tr>
            <th>ID</th>
            <th>Namn</th>
            <th>Åtgärd</th>
        </tr>

        {% for u in users %}
        <tr>
            <td>{{ u.id }}</td>
            <td>{{ u.name }}</td>
            <td>
                <form method="post" action="/ui/users/{{ u.id }}/delete">
                    <button type="submit"
                            onclick="return confirm('Ta bort användaren {{ u.name }}?');">
                        Ta bort
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
<p><a href="/ui">Tillbaka</a></p>
</body>
</html>
